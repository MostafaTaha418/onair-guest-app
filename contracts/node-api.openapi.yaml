openapi: 3.1.0
info:
  title: OnAir integrations-service — Guest App routes
  version: 0.2.0-draft
  description: |
    The Node.js `integrations-service` routes the Guest App calls (Backend Master Plan §12.6).
    The single source of names is `docs/OnAir Backend Master Plan.md` (28 Oct 2026).

    Changed on 28 Oct 2026:
    - There is no SMS. Every code goes to the account's email through `POST /v1/otp/send`.
    - Push tokens moved to the RPCs `common_register_device` / `common_unregister_device`.
      The old `/v1/devices` routes are removed.

    Rules:
    - Every request carries `Authorization: Bearer <Supabase access token>` and
      `x-request-id` (UUID v4).
    - Every error response uses the ErrorResponse shape.
    - Amounts, prices, statuses, and permissions are never sent by the app. Amounts in
      responses are integer minor units (`bigint`) plus `currency`.
    - Reads and other commands go straight to Supabase RPC (`guest_*`, `common_*`). See
      supabase-backend.md and supabase-discovery.md.
servers:
  - url: https://{nodeApiBaseUrl}
    variables:
      nodeApiBaseUrl:
        default: api-staging.example.invalid
        description: Per-flavor value from EnvConfig.nodeApiBaseUrl
security:
  - bearerAuth: []
paths:
  /v1/otp/send:
    post:
      operationId: sendOtpCode
      summary: Generate and email a 6-digit code for an existing challenge
      description: |
        The challenge is created first by an RPC that returns `challenge_id`:
        `common_request_phone_change`, `common_request_account_deletion`,
        `guest_start_cash_confirmation` (or the collector's `partner_record_cash_collection`).
        The caller must be the challenge's requester or its recipient. The code goes to the
        **recipient's account email** through Resend, and only its hash is stored. Calling
        again before `retry_after_seconds` returns 429.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id]
              properties:
                challenge_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSent'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/guest/bookings/start-payment:
    post:
      operationId: startBookingPayment
      summary: Create the booking from a quote and open a Kashier payment session
      description: |
        Calls `guest_start_booking` with the guest's own session, then creates the Kashier
        session with the server-side amount. The same `idempotency_key` always returns the same
        booking and session. Returning from the payment page is **not** a confirmation; the app
        waits for the status notification (Realtime on `notifications`) and polls
        `guest_get_booking`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quote_id, terms_hash, idempotency_key]
              properties:
                quote_id:
                  type: string
                  format: uuid
                terms_hash:
                  type: string
                idempotency_key:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Payment session ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/guest/bookings/{bookingId}/remaining-payment:
    post:
      operationId: startRemainingPayment
      summary: Open a Kashier session for the remaining amount after a deposit
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotency_key]
              properties:
                idempotency_key:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Payment session ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSession'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/uploads/sign:
    post:
      operationId: signUpload
      summary: Get a short-lived signed PUT URL for a private attachment
      description: |
        Checks permission with `common_authorize_upload` (guest: own support case, own case
        message, damage claim on own booking). Limits on type and size come from
        `platform_settings.upload_limits`. Images should have EXIF removed by the app first.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [entity_type, entity_id, mime_type, size_bytes]
              properties:
                entity_type:
                  type: string
                  enum: [support_case, case_message, damage_claim]
                entity_id:
                  type: string
                  format: uuid
                mime_type:
                  type: string
                  enum: [image/jpeg, image/png, image/webp, application/pdf]
                size_bytes:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Upload URL issued
          content:
            application/json:
              schema:
                type: object
                required: [attachment_id, upload_url, expires_at]
                properties:
                  attachment_id:
                    type: string
                    format: uuid
                  upload_url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/files/{attachmentId}/url:
    get:
      operationId: getFileUrl
      summary: Get a short-lived signed GET URL for a private attachment the caller may read
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: URL issued (do not cache it on disk)
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestId:
      name: x-request-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Unified error
      headers:
        Retry-After:
          description: Seconds to wait (present on 429)
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    OtpSent:
      type: object
      required: [sent_to_masked, retry_after_seconds, expires_at]
      properties:
        sent_to_masked:
          type: string
          description: Masked email, e.g. "a***@gmail.com"
        retry_after_seconds:
          type: integer
          minimum: 0
        expires_at:
          type: string
          format: date-time
    PaymentSession:
      type: object
      required: [booking_id, payment_id, payment_url, payment_url_expires_at, amount_minor, currency]
      properties:
        booking_id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        payment_url:
          type: string
          format: uri
        payment_url_expires_at:
          type: string
          format: date-time
        amount_minor:
          type: integer
          description: Display only; computed on the server
        currency:
          type: string
          enum: [EGP]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message_key, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message_key:
              type: string
              examples: [auth.rate_limited]
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
              properties:
                retry_after_seconds:
                  type: integer
                  minimum: 0
    ErrorCode:
      type: string
      description: |
        Codes the Guest App can receive (Backend Master Plan §11; copy in error-codes.md).
        Clients map unknown values to INTERNAL.
      enum:
        - UNAUTHENTICATED
        - PERMISSION_DENIED
        - ACCOUNT_SUSPENDED
        - VALIDATION_FAILED
        - NOT_FOUND
        - ACTION_NOT_ALLOWED
        - RATE_LIMITED
        - CONFLICT
        - APP_VERSION_UNSUPPORTED
        - INTERNAL
        - PHONE_COUNTRY_NOT_SUPPORTED
        - PHONE_ALREADY_USED
        - PHONE_NOT_VERIFIED
        - EMAIL_NOT_VERIFIED
        - OTP_INVALID
        - OTP_EXPIRED
        - TERMS_CHANGED
        - PROFILE_INCOMPLETE
        - ACCOUNT_HAS_ACTIVE_BOOKINGS
        - PROPERTY_NOT_AVAILABLE
        - DATES_UNAVAILABLE
        - GUESTS_EXCEEDED
        - QUOTE_EXPIRED
        - INVALID_BOOKING_STATE
        - REMAINING_NOT_PAID
        - CANCELLATION_TERMS_CHANGED
        - REVIEW_NOT_ALLOWED
        - PAYMENT_AMOUNT_MISMATCH
        - COLLECTOR_NOT_AUTHORIZED
        - CASH_NOT_ALLOWED
        - DUPLICATE_OPERATION

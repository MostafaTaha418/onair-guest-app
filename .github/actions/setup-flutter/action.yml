name: Set up Flutter
description: >
  Install the pinned Flutter SDK, fetch packages, and run code generation steps
  that the project has configured (build_runner, gen-l10n, swagger_parser).

inputs:
  flutter-version:
    description: Flutter SDK version (keep in sync with plan.md)
    default: "3.44.3"

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    - name: Fetch packages
      shell: bash
      run: |
        flutter --version
        flutter pub get

    - name: Code generation (only what is configured)
      shell: bash
      run: |
        if grep -qE '^\s+build_runner:' pubspec.yaml; then
          dart run build_runner build --delete-conflicting-outputs
        fi
        if [ -f l10n.yaml ]; then
          flutter gen-l10n
        fi
        if [ -f swagger_parser.yaml ]; then
          dart run swagger_parser
        fi

# Staging build on merge to main (User Story 7, tasks.md T108).
# Builds the obfuscated staging APK, uploads the obfuscation symbols as an artifact,
# scans the artifact for forbidden key patterns, then distributes it through
# Firebase App Distribution. Required secrets are documented in docs/ci.md.
name: staging-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Staging APK → Firebase App Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true

      - name: Write env/staging.json from secrets
        env:
          STAGING_ENV: ${{ secrets.STAGING_ENV_JSON }}
        run: |
          mkdir -p env
          printf '%s\n' "$STAGING_ENV" > env/staging.json
          jq -e . env/staging.json > /dev/null

      - run: flutter pub get

      - name: Build staging APK
        run: flutter build apk --flavor staging -t lib/main_staging.dart --obfuscate --split-debug-info=build/symbols --dart-define-from-file=env/staging.json

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: staging-symbols-${{ github.sha }}
          path: build/symbols
          if-no-files-found: error

      - name: Scan the APK for secrets
        run: bash tool/scan_build_for_secrets.sh build/app/outputs/flutter-apk/app-staging-release.apk

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_STAGING }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          groups: ${{ secrets.FIREBASE_STAGING_TESTERS }}
          file: build/app/outputs/flutter-apk/app-staging-release.apk

name: on_air
description: OnAir Guest App
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  app_links: ^7.2.2
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  intl: ^0.20.2
  json_annotation: ^4.11.0
  package_info_plus: ^10.2.2
  retrofit: ^4.10.0
  shared_preferences: ^2.5.6
  smart_auth: ^3.2.0
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  alchemist: ^0.14.1
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  freezed: 3.2.5
  integration_test:
    sdk: flutter
  json_serializable: ^6.13.0
  mocktail: ^1.0.5
  retrofit_generator: ^10.3.2
  swagger_parser: ^1.45.0
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800
